services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: yt_triage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yt_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yt_agent_password}
      POSTGRES_DB: ${POSTGRES_DB:-yt_triage}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yt_agent} -d ${POSTGRES_DB:-yt_triage}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

